services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      ALLOW_NETWORK_ACCESS: "true"
      PORT: "3000"
      APP_ORIGIN: http://127.0.0.1:3000
      DATA_DIR: /app/data
    volumes:
      - orbit-data:/app/data
    restart: unless-stopped
volumes:
  orbit-data:
